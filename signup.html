<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/signup.css" type="text/css" media="all"/>
</head>
<body>

    <!--Sign Up Form-->

    <div class="signup-container">
        <h1>Sign Up</h1>
        <form action="signup.php" method="post">
            <fieldset>
                <legend>Personal Information</legend>
                <label for="first-name">First Name: </label>
                <input type="text" id="first-name" name="first-name" required>

                <label for="middle-name">Middle Name: *Optional </label>
                <input type="text" id="middle-name" name="middle-name" placeholder="E.g., Surname">

                <label for="last-name">Last Name: </label>
                <input type="text" id="last-name" name="last-name" required>    

                <label for="birth-date">Date of Birth: </label>
                <input type="date" id="birth-date" name="birth-date" required>
            </fieldset>
            
            <fieldset>
                <legend>Contact Information & Physical Address</legend>
                <label for="phone">Phone Number: </label>
                <input type="text" id="phone" name="phone" required placeholder="E.g., 0***">
                
                <label for="email">Email: </label>
                <input type="email" id="email" name="email" required placeholder="E.g., someone@***.com">

                <label for="address">Region: </label>
                <input type="text" id="address" name="address">
            </fieldset>

            <fieldset>
                <legend>Account Information</legend>
                <label for="username">Username: </label>
                <input type="text" id="username" name="username" required placeholder="@someone">

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required aria-describedby="password-help">
                <p id="password-help">Your password must be at least 8 characters long.</p>

                <label for="confirm-password">Confirm Password: </label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </fieldset>

            <label for="favorite-color">Pick your Favorite Color: </label>
            <input type="color" id="favorite-color" name="favorite-color" value="#9D7651">

            <label for="terms" class="terms">Terms & Conditions</label>
            <input type="checkbox" id="terms" name="terms" required>
            <span>I agree to the terms and condition.</span>

            <button type="submit">Submit</button>
        </form>
    </div>

    <footer class="bx-footer">
            <div> © 2021—2026 | Pushpa PrimeScape Tanzania</div>
    </footer>

    <script src="./main.js"></script>
</body>
</html>
